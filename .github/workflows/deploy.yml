name: Deploy To EC2

on:
  push:
    branches:
      - 7-feature-3-배포용-레포

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: 자바 21버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: application.yml 파일 만들기
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      - name: 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t KafkaChat .

      - name: Docker 이미지에 Tag 추가
        run: docker tag KafkaChat ${{ steps.login-ecr.outputs.registry }}/KafkaChat:latest

      - name: ECR에 Docker 이미지 Push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/KafkaChat:latest

      - name: Docker Compose 파일 EC2로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "compose.yml"
          target: "/home/ubuntu/"
      - name: EC2에 접속하여 애플리케이션 및 Kafka 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            # ✅ 기존 컨테이너 중지 및 삭제
            docker stop KafkaChat || true
            docker rm KafkaChat || true
              
            # ✅ 최신 이미지 가져오기
            docker pull ${{ steps.login-ecr.outputs.registry }}/KafkaChat:latest
              
            # ✅ 기존 Kafka, Redis 컨테이너 중지 및 삭제
            docker compose -f /home/ubuntu/compose.yml down || true
              
            # ✅ Docker Compose로 Kafka, Redis 실행
            docker compose -f /home/ubuntu/compose.yml up -d
              
            # ✅ 애플리케이션 컨테이너 실행
            docker run -d --name KafkaChat -p 8080:8080 --network chat-network ${{ steps.login-ecr.outputs.registry }}/KafkaChat:latest


